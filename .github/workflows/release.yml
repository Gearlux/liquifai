# =========================================================================
# HAND-WRITTEN workflow — NOT generated by `aisland jenkins scaffold`.
# (ci.yml / Jenkinsfile are generated; this release pipeline is separate so
# regeneration never clobbers it.)
#
# Publishes the `liquifai` distribution to PyPI when a version tag is pushed:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Uses PyPI Trusted Publishing (OIDC, no stored API token). One-time setup on
# https://pypi.org/manage/account/publishing/ — add a "pending publisher":
#   PyPI project name: liquifai
#   Owner:             Gearlux
#   Repository:        liquifai
#   Workflow name:     release.yml
#   Environment:       pypi
#
# Publish ORDER: loggair → confluid → liquifai. The wheel smoke test below
# installs this package's dependencies FROM PYPI, so `confluid` must already
# be published there or this workflow fails at pip install (by design — a
# release that no user could install must not reach PyPI).
# =========================================================================
name: Release to PyPI

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Build & verify distribution
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install packaging toolchain
      run: python -m pip install build twine
    - name: Guard - tag matches pyproject version
      run: |
        PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
        TAG_VERSION="${GITHUB_REF_NAME#v}"
        if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
          echo "::error::Tag v$TAG_VERSION does not match pyproject version $PKG_VERSION"
          exit 1
        fi
    - name: Build sdist + wheel
      run: python -m build
    - name: Check package metadata
      run: python -m twine check --strict dist/*
    - name: Smoke-test the built wheel in a clean venv
      # Runs from /tmp: with the repo root as cwd, `import liquifai` would find
      # the SOURCE tree (cwd shadows site-packages) and silently test the repo
      # instead of the wheel. Also exercises the console scripts and the
      # stdlib-only completion fast path.
      run: |
        python -m venv /tmp/smoke
        /tmp/smoke/bin/pip install --quiet dist/*.whl
        test -x /tmp/smoke/bin/liquifai-complete
        test -x /tmp/smoke/bin/liquifai-install-completions
        cd /tmp
        /tmp/smoke/bin/python - <<'EOF'
        from importlib.metadata import version

        from liquifai import LiquifyApp

        app = LiquifyApp(name="smoke")
        captured = {}

        @app.command()
        def hello(name: str = "world") -> None:
            captured["name"] = name

        app.run_command(hello)
        assert captured["name"] == "world"

        # Completion round trip: snapshot the command tree, complete a bare TAB.
        from liquifai.completion import complete_from_tree, serialize_app

        tree = serialize_app(app)
        assert "hello" in complete_from_tree(tree, ["smoke", ""], 1)

        # The fast path must stay stdlib-only: importing liquifai.completion
        # (as liquifai-complete does) must not have pulled in the heavy deps
        # in a fresh interpreter — checked structurally in the test suite;
        # here we just prove the wheel's entry surface is intact.
        print("wheel smoke-test OK, version:", version("liquifai"))
        EOF
    - uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  publish:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for PyPI Trusted Publishing (OIDC)
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/
    - name: Publish
      uses: pypa/gh-action-pypi-publish@release/v1
