[build-system]
# setuptools>=77 is the PEP 639 floor: `license` as a plain SPDX string below
# requires it (the TOML-table form is deprecated, removal slated 2027-02).
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "liquifai"
version = "0.1.0"
description = "A streamlined, type-safe application framework for Python ML/HPC."
readme = "README.md"
authors = [{name = "Gert Behiels"}]
# PEP 639 SPDX expression; the license CLASSIFIER is deliberately absent
# (deprecated in favour of this field — re-adding it reintroduces the
# SetuptoolsDeprecationWarning at build time).
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "rich>=10.0.0",
    "loggair>=0.1.0",
    "confluid>=0.1.0",
]
requires-python = ">=3.12"

[project.optional-dependencies]
# `liquifai[bridge]` — opt-in marker for the PROVISIONAL `liquifai.bridge`
# subpackage (declarative SDK-to-operations engine). It carries no extra
# requirements today: the subpackage is pure stdlib + liquifai's own core, so
# there is nothing for pip to install. What the extra DOES buy is a contract
# boundary that survives the 0.x line:
#   * a consumer writes `liquifai[bridge]`, declaring in its own metadata that
#     it depends on a surface excluded from semantic versioning (see the
#     stability note in liquifai/bridge/__init__.py and CHANGELOG "Unstable");
#   * if the bridge ever grows a real dependency, it lands here without any
#     consumer-visible change;
#   * `import liquifai` never reaches it — the subpackage is deliberately
#     absent from the top-level exports (pinned by tests/test_bridge_group.py).
# Note a pip extra cannot make a dependency-free subpackage physically absent
# from the wheel; this is a declared contract, not an import barrier.
bridge = []
dev = [
    "black>=24.0.0,<25.0.0",
    "isort>=5.13.0,<6.0.0",
    "flake8>=6.0.0,<8.0.0",
    "flake8-junit-report>=2.1.0",
    "mypy>=1.0.0,<2.0.0",
    "pytest>=7.0.0,<9.0.0",
    "pytest-cov>=4.0.0,<7.0.0",
]

[project.scripts]
liquifai-complete = "liquifai._fast_complete:main"
liquifai-install-completions = "liquifai.completion:_cli_install_completions"

[project.urls]
Homepage = "https://github.com/Gearlux/liquifai"
Repository = "https://github.com/Gearlux/liquifai.git"

[tool.aisland.sys-dependencies]
# bash: macOS ships bash 3.2 which lacks the `compopt` builtin used by the
# generated bash completion shim (liquifai/completion.py:_BASH_TEMPLATE).
# The shim is guarded so it works on 3.2 minus the no-trailing-space UX;
# installing modern bash via Homebrew unlocks the full behavior.
brew = ["bash"]

[tool.setuptools.packages.find]
where = ["."]
include = ["liquifai*"]

[tool.setuptools.package-data]
liquifai = ["py.typed"]

[tool.black]
line-length = 120
target-version = ['py38']

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
disable_error_code = ["import-untyped"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
strict_optional = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = [
    "rich.*"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
